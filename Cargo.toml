[package]
name = "fission-yields-data"
version = "0.1.6"
edition = "2024"

license = "GPL-3.0"
description = "Fission Yield Data for some nuclides (ENDF/B-VIII.0 parent-independent yields); no_std + alloc"
homepage = "https://github.com/theodoreOnzGit/fission-yields-data"
repository ="https://github.com/theodoreOnzGit/fission-yields-data"
readme = "README.md"
categories = ["science"]
# The two OpenMC depletion-chain XMLs (~27 MB each) are kept in the repo but
# excluded from the published crate (crates.io limit 10 MB). This key must sit
# in [package]; it previously followed the [[example]] tables, where TOML
# assigned it to the last example and nothing was excluded.
exclude = [
    "src/endf_8_openmc_depletion_data/chain_endfb80_pwr.xml",
    "src/endf_8_openmc_depletion_data/chain_endfb80_sfr.xml",
]

[dependencies]
# no_std + alloc since v0.1.6: uom and strum without their `std` defaults.
uom = { version = "0.38", default-features = false, features = ["autoconvert", "f32", "f64", "si"] }
strum = { version = "0.26", default-features = false }
strum_macros = "0.26"

[dev-dependencies]
approx = "0.5.1"
serde = {version = "1.0.228",  features = ["derive"]}
serde-xml-rs = "0.8.2"

[[example]]
name = "serde_experiment"


[[example]]
name = "serde_chatgpt_5"
